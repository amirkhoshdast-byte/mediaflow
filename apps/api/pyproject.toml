[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() in defaults is the framework idiom. E501: left to ruff format.
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
